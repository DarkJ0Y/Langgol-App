# Local development database.
#
# PostGIS is required, not optional: radius search runs through ST_DWithin against a GIST index.
# The plain `postgres` image will fail the extensions migration.
#
#   docker compose up -d
#   pnpm db:migrate && pnpm db:seed

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: langgol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: langgol
      POSTGRES_PASSWORD: langgol
      POSTGRES_DB: langgol_dev
    ports:
      - '5432:5432'
    volumes:
      - langgol-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U langgol -d langgol_dev']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  langgol-pgdata:
