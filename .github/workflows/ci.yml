name: CI

# Every branch, not just main. CI is where anything needing PostgreSQL is verified — there is no
# expectation that a contributor runs a local database — so a feature branch that never triggers
# it is a feature branch whose migrations, constraints and integration tests were never exercised.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  database:
    name: Prisma schema and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: langgol
          POSTGRES_PASSWORD: langgol
          POSTGRES_DB: langgol_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://langgol:langgol@localhost:5432/langgol_ci
      DIRECT_URL: postgresql://langgol:langgol@localhost:5432/langgol_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      - name: Verify migration status
        run: pnpm --filter @langgol/db run migrate:status

      # The psql output is echoed AND re-emitted as ::error:: annotations. Step logs need a token
      # to read; annotations are readable from the public API, so a failing SQL check can say why
      # it failed rather than only "exit code 3".
      - name: Verify database guarantees exist
        run: |
          set +e
          output=$(pnpm --filter @langgol/db run verify:guarantees 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            echo "$output" | grep -aiE 'error|exception|detail|hint|fatal' | head -20               | while IFS= read -r line; do echo "::error::guarantees: $line"; done
            exit $status
          fi

      # BEFORE the seed, deliberately. This script writes and deletes rows and refuses to run
      # against a database that already holds users — and the seed creates nine development
      # fixtures. Running it afterwards aborts every time.
      - name: Verify database guarantees actually bite
        run: |
          set +e
          output=$(pnpm --filter @langgol/db run verify:behaviour 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            echo "$output" | grep -aiE 'error|exception|detail|hint|fatal' | head -20               | while IFS= read -r line; do echo "::error::behaviour: $line"; done
            exit $status
          fi

      - name: Seed reference data
        run: pnpm db:seed

      # AFTER the seed: these suites read seeded platform configuration and the development
      # fixture allowlist. They are the only place the CHECK constraints, triggers, partial
      # indexes and PostGIS behaviour are exercised through the real repositories.
      - name: Integration tests
        env:
          LANGGOL_INTEGRATION: '1'
        run: pnpm test --reporter=json --outputFile=vitest-results.json

      # A skipped suite and a passing suite look identical in a green checkmark, and this job
      # exists precisely so the database-backed suites run. If DATABASE_URL ever stopped reaching
      # the service container they would skip themselves by design, the job would stay green, and
      # nobody would find out until something reached production unverified.
      - name: Fail if any integration test was skipped
        run: |
          node -e "
            const r = require('./vitest-results.json');
            if (r.numPendingTests > 0) {
              console.error('::error::' + r.numPendingTests + ' test(s) skipped — the database-backed suites did not run.');
              process.exit(1);
            }
            console.log(r.numPassedTests + ' tests ran, none skipped.');
          "

  secret-scan:
    name: Secret and dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject secret-shaped public environment variables
        run: |
          # A NEXT_PUBLIC_* variable is shipped to the browser. One holding a secret is a breach.
          if git grep -nE 'NEXT_PUBLIC_[A-Z0-9_]*(SECRET|KEY|TOKEN|PASSWORD|CREDENTIAL|PRIVATE)' \
               -- ':!*.md' ':!.github/**'; then
            echo "::error::A NEXT_PUBLIC_* variable appears to hold a secret."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high
