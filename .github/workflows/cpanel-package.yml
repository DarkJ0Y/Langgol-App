name: cPanel package

# Builds `langgol_app`, the folder that is uploaded to cPanel, as a downloadable artifact.
# docs/DEPLOY-CPANEL.md
#
# Built here rather than on the host because shared hosting cannot run `pnpm install` or
# `next build` within its memory limits, and on Linux because the Prisma engines and every native
# module must match the server. The artifact holds no secret — the repository is public, and so
# are its artifacts to any signed-in GitHub user. Secrets go into `.env` on the server only.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build the cPanel package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        run: pnpm db:generate

      # Placeholders only: every page is rendered on demand, so nothing connects at build time.
      # The real values live in `.env` on the server.
      - name: Build the standalone server
        env:
          LANGGOL_STANDALONE: '1'
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          DIRECT_URL: postgresql://build:build@localhost:5432/build
          AUTH_SECRET: build-time-placeholder-not-a-secret-0000
          JOB_TRIGGER_SECRET: build-time-placeholder
        run: pnpm --filter @langgol/web run build

      - name: Assemble the package
        run: node scripts/package-cpanel.mjs

      # Start it the way Passenger does and wait for /health, which answers without the database.
      # A package that cannot boot is caught here, not after it has been uploaded.
      - name: Smoke test
        working-directory: deploy/cpanel/out/langgol_app
        run: |
          cat > .env <<'EOF'
          APP_ENV=staging
          NODE_ENV=production
          APP_URL=http://127.0.0.1:3123
          AUTH_MODE=development
          DATABASE_URL=postgresql://smoke:smoke@127.0.0.1:5432/smoke
          DIRECT_URL=postgresql://smoke:smoke@127.0.0.1:5432/smoke
          AUTH_SECRET=generate
          JOB_TRIGGER_SECRET=generate
          KYC_ENCRYPTION_KEY=generate
          EOF
          PORT=3123 node app.js > "$RUNNER_TEMP/smoke.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:3123/health; then echo; break; fi
            sleep 1
          done
          status=0
          curl -fs http://127.0.0.1:3123/health > /dev/null || status=1
          grep -q '=generate' .env && { echo '::error::app.js did not generate the secrets'; status=1; }
          kill %1 || true
          cat "$RUNNER_TEMP/smoke.log"
          if [ $status -ne 0 ]; then
            grep -aiE 'error|cannot|failed' "$RUNNER_TEMP/smoke.log" | head -10 | while IFS= read -r line; do echo "::error::smoke: $line"; done
            exit 1
          fi
          # The .env written above must not ship.
          rm .env

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: langgol_app
          path: deploy/cpanel/out/
          # `server/apps/web/.next` holds the compiled application. Hidden files are left out by
          # default, which would upload a package that cannot render a single page.
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
