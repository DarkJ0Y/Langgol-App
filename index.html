<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnect - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="../pic/Logo.png" alt="Lanngol logo" class="logo" width=" 150px" height="120px">
            <h1></h1>
        </div>
        
        <div class="login-card">
            <h2>Welcome Back!</h2>
            <p class="subtitle">Log in to access your LANGGOL dashboard</p>
            
            <form id="loginForm" action="../homePage.html" method="POST">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    <span class="error-message" id="email-error"></span>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-input">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <i class="fas fa-eye toggle-password"></i>
                    </div>
                    <span class="error-message" id="password-error"></span>
                </div>
                
                <button type="submit" class="login-btn">Log In</button>
                
                <div class="forgot-password">
                    <a href="/forgot-password">Forgot Password?</a>
                </div>
            </form>
            
            <div class="social-login">
                <p class="divider">Or log in with</p>
                <div class="social-buttons">
                    <button class="social-btn google">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button class="social-btn facebook">
                        <i class="fab fa-facebook-f"></i> Facebook
                    </button>
                    <button class="social-btn apple">
                        <i class="fab fa-apple"></i> Apple
                    </button>
                </div>
            </div>
            
            <div class="signup-prompt">
                <p>New to AgriConnect? <a href="/signup">Sign Up</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
